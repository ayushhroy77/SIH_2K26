name: CVGuard CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test Verification (Phase 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Development Tooling and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          pip install -e libs/schemas
          pip install "fastapi>=0.110.0" "uvicorn[standard]>=0.28.0" "pydantic>=2.7.0"

      - name: Verify Shared Schemas Import Cleanliness
        run: make schema-check

      - name: Run Code Style and Type Checks
        run: make lint

      - name: Run Test Suite
        run: make test
