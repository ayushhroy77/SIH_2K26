<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVGuard - Computer Vision Integrity Assurance</title>
    <script>
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || (typeof window !== 'undefined' && obj === window.constructor?.prototype)) && prop === 'fetch') {
              if (descriptor && descriptor.get && !descriptor.set) {
                var getter = descriptor.get;
                var customFetch = null;
                return originalDefineProperty.call(Object, obj, prop, {
                  get: function() {
                    return customFetch || getter.call(this);
                  },
                  set: function(val) {
                    customFetch = val;
                  },
                  configurable: true,
                  enumerable: descriptor.enumerable !== false
                });
              }
            }
            return originalDefineProperty.apply(Object, arguments);
          };
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
