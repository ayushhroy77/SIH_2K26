[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "cvguard-schemas"
version = "0.2.0"
description = "Canonical Pydantic v2 schemas for CVGuard Computer Vision Integrity Assurance platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cvguard_schemas"]
