[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "cvguard-monorepo"
version = "0.1.0"
description = "CVGuard: Production-Grade Offline/Air-Gapped Computer Vision Integrity Assurance Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "CVGuard Core Team", email = "security@cvguard.local" },
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.1.18",
    "minio>=7.2.0",
    "pillow>=10.2.0",
    "imagehash>=4.3.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.1.18",
    "minio>=7.2.0",
    "pillow>=10.2.0",
    "imagehash>=4.3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "onnxruntime>=1.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "libs/schemas",
    "services/gateway",
    "services/data-plane",
    "services/model-plane",
    "services/inference-plane",
    "services/drift-plane",
    "services/governance",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
