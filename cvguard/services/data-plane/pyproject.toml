[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "cvguard-data-plane"
version = "0.2.0"
description = "CVGuard Data Plane Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "cvguard-schemas>=0.2.0",
    "minio>=7.2.0",
    "pillow>=10.2.0",
    "imagehash>=4.3.1",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "onnxruntime>=1.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
